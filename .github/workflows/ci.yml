name: CI

on:
  push:
    branches: [main, claude/**]
  pull_request:
    branches: [main, claude/**]

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --color=yes

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        # 'F' = pyflakes (real bugs), 'E'/'W' = pycodestyle (style).
        # 'I' (isort) is opt-in — existing import ordering varies.
        # We don't fail on style alone; just surface real issues.
        continue-on-error: true
        run: |
          ruff check --select F,E,W --statistics . | tee ruff-report.txt
          echo "---"
          cat ruff-report.txt

  # Smoke-imports job: catches syntax errors and import-time failures
  # across ALL run_*.py scripts and island_model submodules, even
  # though the project has no explicit smoke tests for the entry
  # points. Catches the class of bug where e.g. a renamed symbol
  # in island_model/ makes every run_*.py file fail at import.
  smoke:
    name: smoke import
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import all top-level modules and scripts
        run: |
          set -e
          python -c "import island_model; print('island_model OK')"
          python -c "from island_model import backtester, csv_loader, data_loader, features, island_forest, portfolio_backtester, qsh_parser, synthetic_data; print('all submodules OK')"
          for script in run_*.py; do
            if [ -f "$script" ]; then
              echo "--- $script ---"
              python -c "import ast; ast.parse(open('$script').read())" || (echo "SyntaxError in $script" && exit 1)
            fi
          done
          echo "All entry points parsed OK."
